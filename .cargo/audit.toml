# Settings for `cargo audit`, run by `make audit` before a release.
# Every advisory set aside here carries its reason; a new advisory
# still fails the audit.
[advisories]
ignore = [
    # Unmaintained crates reached only through dependencies Oryx does
    # not control; each moves when its upstream moves.
    "RUSTSEC-2025-0141", # bincode 1, through syntect
    "RUSTSEC-2024-0320", # yaml-rust, through syntect
    "RUSTSEC-2026-0206", # rustybuzz, through usvg
    "RUSTSEC-2026-0192", # ttf-parser, through cosmic-text and usvg
    # In the lock file only: pulled by image formats (exr, avif) that
    # the image crate offers and Oryx never enables, so never compiled.
    "RUSTSEC-2024-0436", # paste, through exr and rav1e
    # A page made to slow the parser down, with wikilinks on. Oryx does
    # not turn them on (`Options::ENABLE_WIKILINKS` is not in the list of
    # `src/doc/markdown.rs`). The fixes come with other changes of the
    # parser, which move after 1.3.0 with their own read.
    "RUSTSEC-2026-0414", # pulldown-cmark 0.13.4, fixed in 0.13.5
    "RUSTSEC-2026-0433", # pulldown-cmark 0.13.4, fixed in 0.13.6
]
