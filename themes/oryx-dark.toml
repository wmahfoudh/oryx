# Oryx Dark: warm desert night. Copper heading ramp encodes hierarchy,
# teal is reserved for links so anything clickable stands out.

[surface]
background = "#201B18"
foreground = "#E6DCCD"

[headings]
h1 = "#F0A868"
h2 = "#D98E4F"
h3 = "#C87137"
h4 = "#B0885F"
h5 = "#9C8468"
h6 = "#8A7A66"

[text]
body = "#E6DCCD"
bold = "#F5EDE0"
italic = "#D9B8A6"
strike = "#877E71"
inline_code = "#E3C495"
inline_code_bg = "#2E2620"
link = "#6FB3A8"
math = "#B79FD1"

[blocks]
code_bg = "#2A231D"
code_border = "#3D332A"
quote_bg = "#272019"
quote_bar = "#C87137"
table_border = "#3D332A"
table_header_bg = "#2E2620"
table_row_alt_bg = "#251F1A"
rule = "#4A3E32"
frontmatter_bg = "#262019"
frontmatter_fg = "#9C8E7B"

[syntax]
keyword = "#E09A5A"
string = "#A8C08A"
number = "#D9B380"
function = "#E3C495"
type = "#6FB3A8"
comment = "#7A6E5F"
operator = "#C4B49E"
variable = "#E6DCCD"
punctuation = "#A39682"

[alerts]
note = "#6FA8D9"
tip = "#8FBF6F"
important = "#B79FD1"
warning = "#E0B054"
caution = "#D96C5F"

[ui]
sidebar_bg = "#1A1613"
sidebar_fg = "#C9BCA8"
sidebar_dir = "#E09A5A"
scrollbar = "#3D332A"
scrollbar_hover = "#55483A"
selection_bg = "#4F3E2B"
overlay_bg = "#2A231D"
overlay_fg = "#E6DCCD"
overlay_highlight = "#4F3E2B"
