# Oryx Dark: the dark inference of Oryx Light. Same hue identity for
# headings (red, gold, olive, sienna) on warm brown-black ground.

[surface]
background = "#241E16"
foreground = "#E8DFC8"

[headings]
h1 = "#E25A45"
h2 = "#D4A73C"
h3 = "#A9B44A"
h4 = "#C87B45"
h5 = "#B3A88E"
h6 = "#948A76"

[text]
body = "#E8DFC8"
bold = "#F5EDD8"
italic = "#D9B8A6"
strike = "#877E71"
inline_code = "#E0B072"
inline_code_bg = "#322A1F"
link = "#63B3A4"
math = "#B79FD1"

[blocks]
code_bg = "#2C251B"
code_border = "#40372A"
quote_bg = "#292218"
quote_bar = "#6B5F4B"
table_border = "#40372A"
table_header_bg = "#322A1F"
table_row_alt_bg = "#272013"
rule = "#4A4132"
frontmatter_bg = "#292218"
frontmatter_fg = "#9C9078"

[syntax]
keyword = "#E06845"
string = "#CE8871"
number = "#C89B5C"
function = "#B7C258"
type = "#63B3A4"
comment = "#8D8271"
operator = "#B3A88E"
variable = "#E8DFC8"
punctuation = "#A39682"

[alerts]
note = "#6FA8D9"
tip = "#8FBF6F"
important = "#B79FD1"
warning = "#D4A73C"
caution = "#E25A45"

[ui]
sidebar_bg = "#1D1811"
sidebar_fg = "#C9BCA0"
sidebar_dir = "#E06845"
scrollbar = "#40372A"
scrollbar_hover = "#59503C"
selection_bg = "#4A4028"
overlay_bg = "#2C251B"
overlay_fg = "#E8DFC8"
overlay_highlight = "#4A4028"
