# GitHub Light: adaptation of GitHub's Primer light palette
# (github.com/primer/primitives, MIT). Faithful to github.com rendering:
# ink headings, blue links, the five official alert colors.

[surface]
background = "#FFFFFF"
foreground = "#1F2328"

[headings]
h1 = "#1F2328"
h2 = "#1F2328"
h3 = "#1F2328"
h4 = "#1F2328"
h5 = "#1F2328"
h6 = "#656D76"

[text]
body = "#1F2328"
bold = "#0D1117"
italic = "#24292F"
strike = "#6E7781"
inline_code = "#1F2328"
inline_code_bg = "#ECEFF2"
link = "#0969DA"
math = "#8250DF"

[blocks]
code_bg = "#F6F8FA"
code_border = "#D0D7DE"
quote_bg = "#FAFBFC"
quote_bar = "#D0D7DE"
table_border = "#D0D7DE"
table_header_bg = "#F6F8FA"
table_row_alt_bg = "#FAFBFC"
rule = "#D0D7DE"
frontmatter_bg = "#F6F8FA"
frontmatter_fg = "#656D76"

[syntax]
keyword = "#CF222E"
string = "#0A3069"
number = "#0550AE"
function = "#8250DF"
type = "#953800"
comment = "#6E7781"
operator = "#57606A"
variable = "#1F2328"
punctuation = "#57606A"

[alerts]
note = "#0969DA"
tip = "#1A7F37"
important = "#8250DF"
warning = "#9A6700"
caution = "#CF222E"

[ui]
sidebar_bg = "#F6F8FA"
sidebar_fg = "#24292F"
sidebar_dir = "#0969DA"
scrollbar = "#D0D7DE"
scrollbar_hover = "#AFB8C1"
selection_bg = "#DDF4FF"
overlay_bg = "#F6F8FA"
overlay_fg = "#1F2328"
overlay_highlight = "#DDF4FF"
search_match_bg = "#FFDF5D66"
search_current_bg = "#FF963273"
